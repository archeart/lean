[general]
renderer=HTML5
copy-theme-extras=yes
plugins=plastexdepgraph plastexshowmore leanblueprint

[document]
toc-depth=2
toc-non-files=True

[files]
directory=../web/
split-level=0

[html5]
localtoc-level=1
mathjax-dollars=False

[images]
# This blueprint uses MathJax and the graph renderer, with no TeX image figures.
enabled=False
imager=none
vector-imager=none
